version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "ci" }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "chore" }
    groups:
      dev-tools: { patterns: ["*"] }
  - package-ecosystem: swift
    directory: /app
    schedule: { interval: monthly }
    commit-message: { prefix: "build" }
